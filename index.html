<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ahmed Nadir's Website</title>

    <style>
        /* =========================
           GENERAL SETTINGS
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: white;
            line-height: 1.6;
            transition: 0.3s;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           NAVIGATION BAR
        ========================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px 8%;

            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);

            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: #cbd5e1;
            transition: 0.2s;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        .theme-button {
            border: none;
            background: #1e293b;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* =========================
           SOCIAL / TELEGRAM BUTTON
        ========================= */

        .social-links {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 38px;
            height: 38px;

            border-radius: 50%;

            background: #1e293b;
            border: 1px solid #334155;

            color: #38bdf8;

            transition: 0.25s;
        }

        .social-icon:hover {
            background: #38bdf8;
            color: #082f49;
            transform: translateY(-3px);
        }

        .social-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        body.light .social-icon {
            background: white;
            border-color: #e2e8f0;
        }

        /* =========================
           HERO SECTION
        ========================= */

        .hero {
            min-height: 85vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 60px 20px;

            background:
                radial-gradient(
                    circle at top,
                    #164e63,
                    #0f172a 55%
                );
        }

        .avatar {
            width: 130px;
            height: 130px;

            border-radius: 50%;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 25px;

            border: 3px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.25);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero h1 {
            font-size: clamp(40px, 8vw, 80px);
            margin-bottom: 8px;
        }

        .hero h1 span {
            color: #38bdf8;
        }

        .hero .tagline {
            color: #38bdf8;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 650px;
            color: #cbd5e1;
            font-size: 20px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .button {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.2s;
        }

        .primary {
            background: #38bdf8;
            color: #082f49;
        }

        .secondary {
            background: #1e293b;
            color: white;
            border: 1px solid #334155;
        }

        .button:hover {
            transform: translateY(-3px);
        }

        .hero .social-links {
            margin-top: 25px;
            justify-content: center;
        }

        /* =========================
           SECTIONS
        ========================= */

        section {
            padding: 80px 8%;
        }

        .section-title {
            text-align: center;
            font-size: 36px;
            margin-bottom: 15px;
        }

        .section-description {
            text-align: center;
            color: #94a3b8;
            max-width: 650px;
            margin: 0 auto 45px;
        }

        /* =========================
           CARDS
        ========================= */

        .cards {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 25px;
        }

        .card {
            background: #1e293b;
            padding: 30px;

            border-radius: 16px;

            border: 1px solid #334155;

            transition: 0.25s;
        }

        .card:hover {
            transform: translateY(-7px);
            border-color: #38bdf8;
        }

        .card-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            color: #94a3b8;
        }

        /* =========================
           ABOUT
        ========================= */

        .about {
            max-width: 850px;
            margin: auto;

            text-align: center;
        }

        .about p {
            color: #cbd5e1;
            font-size: 18px;
        }

        /* =========================
           SKILLS
        ========================= */

        .skills {
            max-width: 800px;
            margin: auto;
        }

        .skill {
            margin-bottom: 20px;
        }

        .skill-name {
            display: flex;
            justify-content: space-between;
            margin-bottom: 7px;
        }

        .progress {
            width: 100%;
            height: 10px;

            background: #1e293b;

            border-radius: 20px;

            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #38bdf8;
            width: 0%;
            transition: width 1.2s ease;
        }

        /* =========================
           CONTACT
        ========================= */

        .contact {
            max-width: 600px;
            margin: auto;
        }

        .contact-social {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 35px;
        }

        .telegram-cta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            padding: 14px 22px;

            border-radius: 12px;

            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #082f49;

            font-weight: bold;
            font-size: 16px;

            transition: 0.25s;

            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.25);
        }

        .telegram-cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 26px rgba(56, 189, 248, 0.35);
        }

        .telegram-cta svg {
            width: 22px;
            height: 22px;
            fill: #082f49;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #64748b;
            margin: 25px 0;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #334155;
        }

        body.light .divider::before,
        body.light .divider::after {
            background: #e2e8f0;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input,
        textarea {
            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border: 1px solid #334155;

            background: #1e293b;

            color: white;

            font-size: 16px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: 2px solid #38bdf8;
        }

        form button {
            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #38bdf8;

            color: #082f49;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            padding: 35px;

            background: #020617;

            color: #94a3b8;
        }

        footer .social-links {
            justify-content: center;
            margin-top: 18px;
        }

        /* =========================
           LIGHT MODE
        ========================= */

        body.light {
            background: #f8fafc;
            color: #0f172a;
        }

        body.light nav {
            background: rgba(255,255,255,0.85);
            border-bottom: 1px solid #e2e8f0;
        }

        body.light .nav-links a {
            color: #475569;
        }

        body.light .hero {
            background:
                radial-gradient(
                    circle at top,
                    #bae6fd,
                    #f8fafc 60%
                );
        }

        body.light .hero p {
            color: #475569;
        }

        body.light .secondary {
            background: white;
            color: #0f172a;
        }

        body.light .card {
            background: white;
            border-color: #e2e8f0;
        }

        body.light .card p {
            color: #64748b;
        }

        body.light .about p {
            color: #475569;
        }

        body.light .progress {
            background: #e2e8f0;
        }

        body.light input,
        body.light textarea {
            background: white;
            color: #0f172a;
            border-color: #cbd5e1;
        }

        body.light footer {
            background: #e2e8f0;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            nav {
                padding: 15px 5%;
            }

            .nav-links {
                gap: 10px;
                font-size: 14px;
            }

            .social-icon {
                width: 32px;
                height: 32px;
            }

            .social-icon svg {
                width: 15px;
                height: 15px;
            }

            .hero {
                min-height: 75vh;
            }

            section {
                padding: 60px 5%;
            }

            .section-title {
                font-size: 30px;
            }

            .telegram-cta {
                width: 100%;
            }
        }
    </style>
</head>
